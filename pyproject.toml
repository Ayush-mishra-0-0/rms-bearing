[project]
name = "rms-mlstm"
version = "0.1.0"
description = "RMS bearing early-warning MLSTM-iForest enterprise pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy==1.26.4",  # pinned: torch 2.3.1+cpu needs numpy 1.x; numpy 2.x breaks torch DLL/bridge on Win
  "scikit-learn>=1.3",
  "scipy==1.13.1",  # pinned to match numpy 1.26
  "pyyaml>=6.0",
  "pyodbc>=5.0",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
  "torch==2.3.1",  # pinned: 2.14+cpu DLL fails on Win (c10.dll 1114); 2.3.1+cpu verified
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
